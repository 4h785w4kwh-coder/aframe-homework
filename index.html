<!DOCTYPE html>
<html>
    <head>
         <title>A Simple Scene</title>
          <script src=
           "https://aframe.io/releases/1.7.0/aframe.min.js"> 
        </script>
        </head>
        <body>
             <a-scene> 
                <a-assets>
                    <a-asset-item
id="chair"
src="assets\chair.glb"
>
</a-asset-item>
<a-asset-item
id="lamp"
src="assets\lamp.glb"
>
</a-asset-item>
<img 
id="sky" 
src="assets\sky.jpg"
>
<a-asset-item
id="house"src="assets\house.glb"
>
</a-asset-item>
<a-asset-item
id="fire"src="assets\fire.glb"
>
</a-asset-item>
<a-asset-item
id="firetruck"src="assets\firetruck.glb"
>
</a-asset-item>

    <img
    id="grass-base" 
    src="assets\Grass_001_COLOR.jpg"
    >
    <img 
    id="grass-ambient-occlusion"
     src="assets\Grass_001_OCC.jpg"
     >
     <img 
     id="grass-normal" 
     src="assets\Grass_001_NORM.jpg"
     >
</a-assets>
                <a-plane 
                material= 
                "src: #grass-base; 
                repeat: 500 500;
                 ambientOcclusionMap: #grass-ambient-occlusion; 
                 ambientOcclusionTextureRepeat: 500 500;
                  normalMap: #grass-normal; 
                  normalTextureRepeat: 500 500"
                  position="0 0 0"
                  rotation="-90 0 0"
                  width="500"
                  height="500"
                  >
                </a-plane>
                
                  <a-sky
      src="#sky"
      >
    </a-sky>
                    > 
                </a-sky>
                

<a-entity
gltf-model="#chair"
position="7.5 .5 -8"
rotation="0 90 0"
scale=".2 .2 .2"
>
</a-entity>

<a-entity
gltf-model="#house"
position="12 0 -10"
rotation="0 0 0"
scale=".7 .7 .7"
>
</a-entity>
<a-entity
gltf-model="#fire"
position="12 2 -5"
rotation="0 0 0"
scale="40 40 40"
>
</a-entity>
<a-entity
gltf-model="#firetruck"
position="-5 3 10"
rotation="0 0 0"
scale="7 7 7"
>
</a-entity>
             </a-scene>
            </body>
            </html>
